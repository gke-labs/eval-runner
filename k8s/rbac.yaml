# Least-privilege RBAC for eval-runner controller.
# No ClusterRole is required: the controller scopes its informers and caches
# strictly to eval-runner and eval-runner-sandbox namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eval-runner-controller
  namespace: eval-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eval-runner-controller
  namespace: eval-runner
rules:
- apiGroups:
  - evalrunner.gke-labs.dev
  resources:
  - runs
  - runs/status
  - comparisons
  - comparisons/status
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - delete
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - eval-runner-config
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eval-runner-controller
  namespace: eval-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eval-runner-controller
subjects:
- kind: ServiceAccount
  name: eval-runner-controller
  namespace: eval-runner
---
# Role for managing Sandbox CRs and inspecting pods in the sandbox namespace.
# Note: pods/exec is dropped because controller drives sandboxes via direct
# sandboxd RPCs (gRPC ProcessService on :9090, REST FilesystemService on :8080).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eval-runner-controller-sandbox
  namespace: eval-runner-sandbox
rules:
- apiGroups:
  - agents.x-k8s.io
  resources:
  - sandboxes
  verbs:
  - create
  - get
  - list
  - watch
  - delete
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - create
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - model-credentials
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eval-runner-controller-sandbox
  namespace: eval-runner-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eval-runner-controller-sandbox
subjects:
- kind: ServiceAccount
  name: eval-runner-controller
  namespace: eval-runner
---
# Least-privilege read-only RBAC for eval-runner-ui.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eval-runner-ui
  namespace: eval-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eval-runner-ui
  namespace: eval-runner
rules:
- apiGroups:
  - evalrunner.gke-labs.dev
  resources:
  - runs
  - comparisons
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eval-runner-ui
  namespace: eval-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eval-runner-ui
subjects:
- kind: ServiceAccount
  name: eval-runner-ui
  namespace: eval-runner
