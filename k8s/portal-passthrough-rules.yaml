apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-passthrough-rules
  namespace: service-portal-system
data:
  source-hosting.yaml: |
    # Source hosting
    apiVersion: portals.gke.io/v1alpha1
    kind: PortalRule
    spec:
      host: github.com
    ---
    apiVersion: portals.gke.io/v1alpha1
    kind: PortalRule
    spec:
      host: codeload.github.com
    ---
    apiVersion: portals.gke.io/v1alpha1
    kind: PortalRule
    spec:
      host: objects.githubusercontent.com
    ---
    apiVersion: portals.gke.io/v1alpha1
    kind: PortalRule
    spec:
      host: raw.githubusercontent.com
  python.yaml: |
    # Python
    apiVersion: portals.gke.io/v1alpha1
    kind: PortalRule
    spec:
      host: pypi.org
    ---
    apiVersion: portals.gke.io/v1alpha1
    kind: PortalRule
    spec:
      host: files.pythonhosted.org
    ---
    apiVersion: portals.gke.io/v1alpha1
    kind: PortalRule
    spec:
      host: astral.sh
  operating-system-packages.yaml: |
    # Operating-system packages
    apiVersion: portals.gke.io/v1alpha1
    kind: PortalRule
    spec:
      host: deb.debian.org
    ---
    apiVersion: portals.gke.io/v1alpha1
    kind: PortalRule
    spec:
      host: security.debian.org
    ---
    apiVersion: portals.gke.io/v1alpha1
    kind: PortalRule
    spec:
      host: archive.ubuntu.com
    ---
    apiVersion: portals.gke.io/v1alpha1
    kind: PortalRule
    spec:
      host: security.ubuntu.com
    ---
    apiVersion: portals.gke.io/v1alpha1
    kind: PortalRule
    spec:
      host: ports.ubuntu.com
  node.yaml: |
    # Node
    apiVersion: portals.gke.io/v1alpha1
    kind: PortalRule
    spec:
      host: registry.npmjs.org
  google-cloud-storage.yaml: |
    # Google Cloud Storage
    apiVersion: portals.gke.io/v1alpha1
    kind: PortalRule
    spec:
      host: storage.googleapis.com
