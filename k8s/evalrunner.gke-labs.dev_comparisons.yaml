---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: comparisons.evalrunner.gke-labs.dev
spec:
  group: evalrunner.gke-labs.dev
  names:
    kind: Comparison
    listKind: ComparisonList
    plural: comparisons
    shortNames:
    - comp
    - comparison
    singular: comparison
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.verdict
      name: Verdict
      type: string
    - jsonPath: .status.pImprovement
      name: P(imp)
      type: number
    - jsonPath: .status.summary.tasks
      name: Tasks
      type: string
    - jsonPath: .spec.baseline.run
      name: Baseline
      type: string
    - jsonPath: .spec.candidate.run
      name: Candidate
      type: string
    - jsonPath: .status.completionTime
      name: Completed
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Comparison is the Schema for the comparisons API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ComparisonSpec defines the desired state of Comparison.
            properties:
              baseline:
                description: Baseline specifies the baseline Run to compare against.
                properties:
                  run:
                    description: Run is the name of the Run resource in the same namespace.
                    type: string
                required:
                - run
                type: object
              budgetUSD:
                description: BudgetUSD is the optional maximum total evaluation cost
                  in USD for this Comparison across all tasks and batches.
                minimum: 0
                type: number
              candidate:
                description: Candidate specifies the candidate (e.g. PR) Run.
                properties:
                  run:
                    description: Run is the name of the Run resource in the same namespace.
                    type: string
                required:
                - run
                type: object
              equivalenceMargin:
                default: 0.05
                description: 'EquivalenceMargin is the statistical equivalence margin
                  (default: 0.05 for ±0.05).'
                maximum: 0.5
                minimum: 0
                type: number
              extraSamples:
                description: ExtraSamples requests evaluating N additional samples
                  per undecided task (or per all tasks if all are decided) beyond
                  the stopping rule.
                minimum: 0
                type: integer
              pullRequest:
                description: PullRequest references an optional GitHub pull request
                  to report results to.
                properties:
                  baseSHA:
                    description: BaseSHA is the SHA of the base commit of the pull
                      request.
                    type: string
                  headSHA:
                    description: HeadSHA is the SHA of the head commit of the pull
                      request.
                    type: string
                  number:
                    description: Number is the pull request number.
                    minimum: 1
                    type: integer
                  repository:
                    description: Repository is the GitHub repository in "owner/name"
                      format.
                    type: string
                required:
                - number
                - repository
                type: object
              sampling:
                description: |-
                  Sampling configures paired batch sampling driven by the stopping rule.
                  When omitted, only the single pair of referenced runs is compared.
                properties:
                  batchSize:
                    default: 8
                    description: 'BatchSize is the number of samples to evaluate in
                      each subsequent batch (default: 8).'
                    minimum: 1
                    type: integer
                  maxSamplesPerTask:
                    default: 64
                    description: 'MaxSamplesPerTask is the maximum total number of
                      samples evaluated per task across all batches (default: 64).'
                    minimum: 1
                    type: integer
                type: object
              tasks:
                description: |-
                  Tasks is an optional allow-list of task IDs to compare.
                  If empty, all tasks present in both candidate and baseline runs are compared.
                items:
                  type: string
                type: array
            required:
            - baseline
            - candidate
            type: object
          status:
            description: ComparisonStatus defines the observed state of Comparison.
            properties:
              affinity:
                description: Affinity records changed-file affinity metadata for pull
                  requests.
                properties:
                  fallbackReason:
                    description: |-
                      FallbackReason records why changed-file affinity fell back to order mode with all tasks always
                      (e.g. GitHub API error or permissions).
                    type: string
                  filesCount:
                    description: FilesCount is the count of changed files retrieved
                      from GitHub.
                    type: integer
                  filesHash:
                    description: FilesHash is the SHA-256 checksum of the sorted changed
                      files list.
                    type: string
                  truncated:
                    description: Truncated is true if the changed file count reached
                      the maximum cap (300).
                    type: boolean
                type: object
              batches:
                description: Batches records the status of each paired batch of Runs
                  evaluated for this Comparison.
                items:
                  description: ComparisonBatchStatus records the execution state of
                    one paired batch of Runs.
                  properties:
                    baselineRun:
                      description: BaselineRun is the name of the baseline Run for
                        this batch.
                      type: string
                    candidateRun:
                      description: CandidateRun is the name of the candidate Run for
                        this batch.
                      type: string
                    index:
                      description: Index is the 1-based index of this batch.
                      minimum: 1
                      type: integer
                    phase:
                      description: Phase is the lifecycle phase of this batch (Running,
                        Completed).
                      enum:
                      - Running
                      - Completed
                      type: string
                    sampleRange:
                      description: SampleRange is the window of samples evaluated
                        in this batch.
                      properties:
                        end:
                          description: End is the 1-based inclusive end index in the
                            dataset.
                          minimum: 1
                          type: integer
                        start:
                          description: Start is the 1-based inclusive start index
                            in the dataset.
                          minimum: 1
                          type: integer
                      required:
                      - end
                      - start
                      type: object
                      x-kubernetes-validations:
                      - message: end must be greater than or equal to start
                        rule: self.end >= self.start
                  required:
                  - baselineRun
                  - candidateRun
                  - index
                  type: object
                type: array
              budget:
                description: Budget records spend and enforcement against spec.budgetUSD.
                properties:
                  enforced:
                    description: Enforced indicates whether the budget was enforced.
                    type: boolean
                  limitUSD:
                    description: LimitUSD is the budget limit in USD from spec.budgetUSD.
                    type: number
                  note:
                    description: Note provides explanation if the budget could not
                      be enforced (e.g. unknown model price).
                    type: string
                  spentUSD:
                    description: SpentUSD is the total USD spent so far across all
                      batches and tasks.
                    type: number
                type: object
              completionTime:
                description: |-
                  CompletionTime is the timestamp when the comparison reached the Completed phase.
                  It is cleared if a later extraSamples bump moves the Comparison back to Running.
                format: date-time
                type: string
              conditions:
                description: Conditions records lifecycle conditions on the Comparison.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              costUSD:
                description: CostUSD is the total estimated evaluation cost in USD
                  across all tasks in this Comparison.
                type: number
              extraSamplesApplied:
                description: ExtraSamplesApplied records the number of extra samples
                  that have been consumed into extension batches.
                type: integer
              handledCommands:
                description: HandledCommands records review comment commands that
                  have been processed by the controller.
                items:
                  description: ComparisonHandledCommand represents a review comment
                    command that has been processed by the controller.
                  properties:
                    commentId:
                      description: CommentID is the GitHub issue comment ID where
                        the command was issued.
                      format: int64
                      type: integer
                    handledAt:
                      description: HandledAt is the time when the controller processed
                        the command.
                      format: date-time
                      type: string
                    login:
                      description: Login is the GitHub username of the user who issued
                        the command.
                      type: string
                    outcome:
                      description: 'Outcome records the result of processing the command
                        (e.g. "applied", "denied: unauthorized", or error details).'
                      type: string
                    receivedAt:
                      description: ReceivedAt is the time when the webhook received
                        and recorded the command.
                      format: date-time
                      type: string
                    requested:
                      description: Requested is the number of additional samples requested.
                      type: integer
                  required:
                  - commentId
                  - login
                  - receivedAt
                  - requested
                  type: object
                type: array
              message:
                description: Message is human-readable detail on failure, notes, or
                  current status.
                type: string
              observedBaselineRun:
                description: ObservedBaselineRun records the baseline Run from which
                  the current status was computed.
                type: string
              observedCandidateRun:
                description: ObservedCandidateRun records the candidate Run from which
                  the current status was computed.
                type: string
              pImprovement:
                description: PImprovement is the posterior probability that the candidate
                  is a net improvement.
                maximum: 1
                minimum: 0
                type: number
              pendingCommands:
                description: PendingCommands records unhandled review comment commands
                  waiting for controller processing.
                items:
                  description: ComparisonPendingCommand represents an unhandled command
                    received from a GitHub review comment.
                  properties:
                    attempts:
                      description: Attempts is the number of times the controller
                        has attempted to process this command.
                      type: integer
                    commentId:
                      description: CommentID is the GitHub issue comment ID where
                        the command was issued.
                      format: int64
                      type: integer
                    login:
                      description: Login is the GitHub username of the user who issued
                        the command.
                      type: string
                    nextAttemptAt:
                      description: |-
                        NextAttemptAt is the earliest time when the controller should next attempt this command.
                        If nil or in the past, the command is eligible for processing immediately.
                      format: date-time
                      type: string
                    receivedAt:
                      description: ReceivedAt is the time when the webhook received
                        and recorded the command.
                      format: date-time
                      type: string
                    requested:
                      description: Requested is the number of additional samples requested.
                      type: integer
                  required:
                  - commentId
                  - login
                  - receivedAt
                  - requested
                  type: object
                type: array
              phase:
                description: Phase is the lifecycle phase of the comparison (Running,
                  Completed, Failed).
                enum:
                - Running
                - Completed
                type: string
              possibleSamples:
                description: PossibleSamples is the total possible samples across
                  tasks when known from the Inspect log.
                type: integer
              reporting:
                description: Reporting records the status of GitHub PR comment and
                  check run reporting.
                properties:
                  annotationsHash:
                    description: AnnotationsHash is the hash of the annotations posted
                      to the check run.
                    type: string
                  annotationsPosted:
                    description: |-
                      AnnotationsPosted indicates whether sample failure annotations have already been posted to the check run.
                      GitHub appends annotations on each check run update, so they are only posted once when the comparison completes.
                    type: boolean
                  attempts:
                    description: Attempts is the number of times the controller has
                      attempted to report to GitHub.
                    type: integer
                  checkRunID:
                    description: |-
                      CheckRunID is the legacy GitHub check run ID created or updated for this comparison.
                      Deprecated: use CheckRunIDs.
                    format: int64
                    type: integer
                  checkRunIDs:
                    additionalProperties:
                      format: int64
                      type: integer
                    description: |-
                      CheckRunIDs maps commit SHA to GitHub check run ID created or updated for this comparison.
                      Bounded by pushes to the pull request; entries are preserved to track historical check runs.
                    type: object
                  commentID:
                    description: CommentID is the GitHub issue comment ID created
                      or updated for this comparison.
                    format: int64
                    type: integer
                  lastPostedHash:
                    description: LastPostedHash is the hash of the last successfully
                      posted content and state.
                    type: string
                  message:
                    description: Message records error or status details (e.g. "disabled"
                      or permanent error message).
                    type: string
                  nextAttemptAt:
                    description: |-
                      NextAttemptAt is the earliest time when the controller should next attempt reporting.
                      If nil or in the past, reporting is eligible immediately.
                    format: date-time
                    type: string
                type: object
              summary:
                description: Summary provides aggregate statistics across tasks in
                  the Comparison.
                properties:
                  affinityMatched:
                    description: AffinityMatched is the count of tasks with affinity
                      "matched".
                    type: integer
                  skipped:
                    description: Skipped is the count of tasks discovered in the manifest
                      but not planned by either Run.
                    type: integer
                  tasks:
                    description: Tasks is a compact string representing completed
                      vs total tasks (e.g. "2/2").
                    type: string
                type: object
              summaryPath:
                description: SummaryPath is the storage path or URI where comparisons/<name>.json
                  was written to the artifact sink.
                type: string
              tasks:
                description: Tasks records the status and paired comparison results
                  for each evaluated task.
                items:
                  description: ComparisonTaskStatus records the paired comparison
                    results for a single task.
                  properties:
                    affinity:
                      description: 'Affinity is the changed-file affinity for this
                        task: always, matched, or unmatched.'
                      type: string
                    baseRate:
                      description: BaseRate is the mean score or success rate of baseline
                        samples.
                      maximum: 1
                      minimum: 0
                      type: number
                    candidateRate:
                      description: CandidateRate is the mean score or success rate
                        of candidate samples.
                      maximum: 1
                      minimum: 0
                      type: number
                    costSource:
                      description: CostSource is the provenance of model prices used
                        to compute costUSD (configmap or default).
                      enum:
                      - configmap
                      - default
                      type: string
                    costUSD:
                      description: CostUSD is the estimated task evaluation cost in
                        USD from model prices across candidate and baseline.
                      type: number
                    decision:
                      description: 'Decision is the stopping rule decision: improved,
                        regressed, unchanged, inconclusive, or continue.'
                      enum:
                      - improved
                      - regressed
                      - unchanged
                      - inconclusive
                      - running
                      - continue
                      - skipped
                      type: string
                    delta:
                      description: Delta is the sample mean difference (candidate
                        - baseline).
                      maximum: 1
                      minimum: -1
                      type: number
                    deltaCI:
                      description: DeltaCI is the confidence interval on the paired
                        delta.
                      properties:
                        lower:
                          description: Lower is the lower confidence bound.
                          maximum: 1
                          minimum: -1
                          type: number
                        upper:
                          description: Upper is the upper confidence bound.
                          maximum: 1
                          minimum: -1
                          type: number
                      required:
                      - lower
                      - upper
                      type: object
                    dropped:
                      description: Dropped records the number of unpaired samples
                        dropped from candidate and baseline.
                      properties:
                        baseline:
                          description: Baseline is the number of baseline samples
                            dropped due to lack of a matching candidate.
                          type: integer
                        candidate:
                          description: Candidate is the number of candidate samples
                            dropped due to lack of a matching baseline.
                          type: integer
                      type: object
                    id:
                      description: ID is the unique identifier of the task (e.g. docs/readme_comprehension).
                      type: string
                    label:
                      description: 'Label is the decision outcome for this task: improved,
                        regressed, unchanged, inconclusive, or running.'
                      enum:
                      - improved
                      - regressed
                      - unchanged
                      - inconclusive
                      - running
                      - continue
                      - skipped
                      type: string
                    latency:
                      description: Latency records sample latency percentiles (p50
                        and p95 in seconds) aggregated across evaluated samples.
                      properties:
                        p50:
                          description: P50 is the 50th percentile sample latency in
                            seconds.
                          type: number
                        p95:
                          description: P95 is the 95th percentile sample latency in
                            seconds.
                          type: number
                      type: object
                    losses:
                      description: Losses is the number of paired samples where the
                        candidate scored lower than baseline.
                      type: integer
                    pImprovement:
                      description: PImprovement is the posterior probability that
                        candidate is better than baseline for this task.
                      maximum: 1
                      minimum: 0
                      type: number
                    pairs:
                      description: Pairs is the number of matched (paired) sample
                        pairs.
                      type: integer
                    possibleSamples:
                      description: PossibleSamples is the total dataset size (possible
                        samples) for this task when known from the Inspect log.
                      type: integer
                    samplesRun:
                      description: SamplesRun is the total number of samples evaluated
                        for this task across all batches.
                      type: integer
                    suggestedNext:
                      description: SuggestedNext is the suggested number of additional
                        samples to run if undecided.
                      type: integer
                    ties:
                      description: Ties is the number of paired samples where candidate
                        and baseline scored equally.
                      type: integer
                    tokens:
                      description: Tokens is the token usage breakdown consumed for
                        this task across evaluated runs, when present in Inspect logs.
                      properties:
                        cacheRead:
                          description: CacheRead is the number of cached input tokens
                            read.
                          type: integer
                        cacheWrite:
                          description: CacheWrite is the number of tokens written
                            to the cache.
                          type: integer
                        input:
                          description: Input is the number of input/prompt tokens
                            consumed.
                          type: integer
                        output:
                          description: Output is the number of output/completion tokens
                            consumed.
                          type: integer
                        reasoning:
                          description: Reasoning is the number of reasoning/thinking
                            tokens consumed.
                          type: integer
                        total:
                          description: Total is the total number of tokens consumed
                            (input + output).
                          type: integer
                      type: object
                    wins:
                      description: Wins is the number of paired samples where the
                        candidate scored higher than baseline.
                      type: integer
                  required:
                  - id
                  type: object
                type: array
              verdict:
                description: Verdict is the aggregate run-level verdict (IMPROVED,
                  REGRESSED, UNCHANGED, INCONCLUSIVE, RUNNING).
                enum:
                - IMPROVED
                - REGRESSED
                - UNCHANGED
                - INCONCLUSIVE
                - RUNNING
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
