---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: comparisons.evalrunner.gke-labs.dev
spec:
  group: evalrunner.gke-labs.dev
  names:
    kind: Comparison
    listKind: ComparisonList
    plural: comparisons
    shortNames:
    - comp
    - comparison
    singular: comparison
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.verdict
      name: Verdict
      type: string
    - jsonPath: .status.pImprovement
      name: P(imp)
      type: number
    - jsonPath: .status.summary.tasks
      name: Tasks
      type: string
    - jsonPath: .spec.baseline.run
      name: Baseline
      type: string
    - jsonPath: .spec.candidate.run
      name: Candidate
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Comparison is the Schema for the comparisons API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ComparisonSpec defines the desired state of Comparison.
            properties:
              baseline:
                description: Baseline specifies the baseline Run to compare against.
                properties:
                  run:
                    description: Run is the name of the Run resource in the same namespace.
                    type: string
                required:
                - run
                type: object
              candidate:
                description: Candidate specifies the candidate (e.g. PR) Run.
                properties:
                  run:
                    description: Run is the name of the Run resource in the same namespace.
                    type: string
                required:
                - run
                type: object
              equivalenceMargin:
                default: 0.05
                description: 'EquivalenceMargin is the statistical equivalence margin
                  (default: 0.05 for ±0.05).'
                maximum: 0.5
                minimum: 0
                type: number
              pullRequest:
                description: PullRequest references an optional GitHub pull request
                  to report results to.
                properties:
                  baseSHA:
                    description: BaseSHA is the SHA of the base commit of the pull
                      request.
                    type: string
                  headSHA:
                    description: HeadSHA is the SHA of the head commit of the pull
                      request.
                    type: string
                  number:
                    description: Number is the pull request number.
                    minimum: 1
                    type: integer
                  repository:
                    description: Repository is the GitHub repository in "owner/name"
                      format.
                    type: string
                required:
                - number
                - repository
                type: object
              sampling:
                description: |-
                  Sampling configures paired batch sampling driven by the stopping rule.
                  When omitted, only the single pair of referenced runs is compared.
                properties:
                  batchSize:
                    default: 8
                    description: 'BatchSize is the number of samples to evaluate in
                      each subsequent batch (default: 8).'
                    minimum: 1
                    type: integer
                  maxSamplesPerTask:
                    default: 64
                    description: 'MaxSamplesPerTask is the maximum total number of
                      samples evaluated per task across all batches (default: 64).'
                    minimum: 1
                    type: integer
                type: object
              tasks:
                description: |-
                  Tasks is an optional allow-list of task IDs to compare.
                  If empty, all tasks present in both candidate and baseline runs are compared.
                items:
                  type: string
                type: array
            required:
            - baseline
            - candidate
            type: object
          status:
            description: ComparisonStatus defines the observed state of Comparison.
            properties:
              batches:
                description: Batches records the status of each paired batch of Runs
                  evaluated for this Comparison.
                items:
                  description: ComparisonBatchStatus records the execution state of
                    one paired batch of Runs.
                  properties:
                    baselineRun:
                      description: BaselineRun is the name of the baseline Run for
                        this batch.
                      type: string
                    candidateRun:
                      description: CandidateRun is the name of the candidate Run for
                        this batch.
                      type: string
                    index:
                      description: Index is the 1-based index of this batch.
                      minimum: 1
                      type: integer
                    phase:
                      description: Phase is the lifecycle phase of this batch (Running,
                        Completed).
                      enum:
                      - Running
                      - Completed
                      type: string
                    sampleRange:
                      description: SampleRange is the window of samples evaluated
                        in this batch.
                      properties:
                        end:
                          description: End is the 1-based inclusive end index in the
                            dataset.
                          minimum: 1
                          type: integer
                        start:
                          description: Start is the 1-based inclusive start index
                            in the dataset.
                          minimum: 1
                          type: integer
                      required:
                      - end
                      - start
                      type: object
                      x-kubernetes-validations:
                      - message: end must be greater than or equal to start
                        rule: self.end >= self.start
                  required:
                  - baselineRun
                  - candidateRun
                  - index
                  type: object
                type: array
              message:
                description: Message is human-readable detail on failure or current
                  status.
                type: string
              pImprovement:
                description: PImprovement is the posterior probability that the candidate
                  is a net improvement.
                maximum: 1
                minimum: 0
                type: number
              phase:
                description: Phase is the lifecycle phase of the comparison (Running,
                  Completed, Failed).
                enum:
                - Running
                - Completed
                type: string
              reporting:
                description: Reporting records the status of GitHub PR comment and
                  check run reporting.
                properties:
                  checkRunID:
                    description: CheckRunID is the GitHub check run ID created or
                      updated for this comparison.
                    format: int64
                    type: integer
                  commentID:
                    description: CommentID is the GitHub issue comment ID created
                      or updated for this comparison.
                    format: int64
                    type: integer
                  lastPostedHash:
                    description: LastPostedHash is the hash of the last successfully
                      posted content and state.
                    type: string
                  message:
                    description: Message records error or status details (e.g. "disabled"
                      or permanent error message).
                    type: string
                type: object
              summary:
                description: Summary provides aggregate statistics across tasks in
                  the Comparison.
                properties:
                  skipped:
                    description: Skipped is the count of tasks discovered in the manifest
                      but not planned by either Run.
                    type: integer
                  tasks:
                    description: Tasks is a compact string representing completed
                      vs total tasks (e.g. "2/2").
                    type: string
                type: object
              summaryPath:
                description: SummaryPath is the storage path or URI where comparisons/<name>.json
                  was written to the artifact sink.
                type: string
              tasks:
                description: Tasks records the status and paired comparison results
                  for each evaluated task.
                items:
                  description: ComparisonTaskStatus records the paired comparison
                    results for a single task.
                  properties:
                    baseRate:
                      description: BaseRate is the mean score or success rate of baseline
                        samples.
                      maximum: 1
                      minimum: 0
                      type: number
                    candidateRate:
                      description: CandidateRate is the mean score or success rate
                        of candidate samples.
                      maximum: 1
                      minimum: 0
                      type: number
                    decision:
                      description: 'Decision is the stopping rule decision: improved,
                        regressed, unchanged, inconclusive, or continue.'
                      enum:
                      - improved
                      - regressed
                      - unchanged
                      - inconclusive
                      - running
                      - continue
                      type: string
                    delta:
                      description: Delta is the sample mean difference (candidate
                        - baseline).
                      maximum: 1
                      minimum: -1
                      type: number
                    deltaCI:
                      description: DeltaCI is the confidence interval on the paired
                        delta.
                      properties:
                        lower:
                          description: Lower is the lower confidence bound.
                          maximum: 1
                          minimum: -1
                          type: number
                        upper:
                          description: Upper is the upper confidence bound.
                          maximum: 1
                          minimum: -1
                          type: number
                      required:
                      - lower
                      - upper
                      type: object
                    dropped:
                      description: Dropped records the number of unpaired samples
                        dropped from candidate and baseline.
                      properties:
                        baseline:
                          description: Baseline is the number of baseline samples
                            dropped due to lack of a matching candidate.
                          type: integer
                        candidate:
                          description: Candidate is the number of candidate samples
                            dropped due to lack of a matching baseline.
                          type: integer
                      type: object
                    id:
                      description: ID is the unique identifier of the task (e.g. docs/readme_comprehension).
                      type: string
                    label:
                      description: 'Label is the decision outcome for this task: improved,
                        regressed, unchanged, inconclusive, or running.'
                      enum:
                      - improved
                      - regressed
                      - unchanged
                      - inconclusive
                      - running
                      - continue
                      type: string
                    losses:
                      description: Losses is the number of paired samples where the
                        candidate scored lower than baseline.
                      type: integer
                    pairs:
                      description: Pairs is the number of matched (paired) sample
                        pairs.
                      type: integer
                    samplesRun:
                      description: SamplesRun is the total number of samples evaluated
                        for this task across all batches.
                      type: integer
                    ties:
                      description: Ties is the number of paired samples where candidate
                        and baseline scored equally.
                      type: integer
                    wins:
                      description: Wins is the number of paired samples where the
                        candidate scored higher than baseline.
                      type: integer
                  required:
                  - id
                  type: object
                type: array
              verdict:
                description: Verdict is the aggregate run-level verdict (IMPROVED,
                  REGRESSED, UNCHANGED, INCONCLUSIVE, RUNNING).
                enum:
                - IMPROVED
                - REGRESSED
                - UNCHANGED
                - INCONCLUSIVE
                - RUNNING
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
