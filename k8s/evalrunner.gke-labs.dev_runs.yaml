---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: runs.evalrunner.gke-labs.dev
spec:
  group: evalrunner.gke-labs.dev
  names:
    kind: Run
    listKind: RunList
    plural: runs
    shortNames:
    - run
    singular: run
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.summary.tasks
      name: Tasks
      type: string
    - jsonPath: .status.summary.totalSamples
      name: Samples
      type: integer
    - jsonPath: .status.summary.rates
      name: Rates
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Run is the Schema for the runs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RunSpec defines the desired state of Run.
            properties:
              cohort:
                description: Cohort is an optional cohort identifier grouping runs
                  across suite expansions or configurations.
                type: string
              limit:
                description: |-
                  Limit is an optional per-task cap on samples (passed to Inspect as --limit).
                  Mutually exclusive with SampleRange.
                minimum: 1
                type: integer
              model:
                description: |-
                  Model is the Inspect model identifier (e.g. mockllm/model, google/gemini-3.5-flash-lite).
                  If empty, the Run stops after discovery.
                type: string
              repo:
                description: Repo specifies the repository and commit to run.
                properties:
                  commit:
                    description: Commit is the exact git commit SHA to checkout.
                    pattern: ^[0-9a-fA-F]{7,64}$
                    type: string
                  url:
                    description: URL is the git clone URL for the repository under
                      test.
                    type: string
                required:
                - commit
                - url
                type: object
              sampleRange:
                description: |-
                  SampleRange is an optional 1-based inclusive window of samples to evaluate (e.g. {start: 1, end: 5}).
                  Passed to Inspect as --limit START-END. Mutually exclusive with Limit.
                properties:
                  end:
                    description: End is the 1-based inclusive end index in the dataset.
                    minimum: 1
                    type: integer
                  start:
                    description: Start is the 1-based inclusive start index in the
                      dataset.
                    minimum: 1
                    type: integer
                required:
                - end
                - start
                type: object
                x-kubernetes-validations:
                - message: end must be greater than or equal to start
                  rule: self.end >= self.start
              tasks:
                description: |-
                  Tasks is an optional allow-list of task IDs to run.
                  If empty, all tasks with empty resources are eligible.
                items:
                  type: string
                type: array
            required:
            - repo
            type: object
            x-kubernetes-validations:
            - message: limit and sampleRange are mutually exclusive
              rule: '!(has(self.limit) && has(self.sampleRange))'
          status:
            description: RunStatus defines the observed state of Run.
            properties:
              artifacts:
                description: Artifacts is the base URI or prefix where artifacts for
                  this Run are stored (e.g. gs://bucket/runs/<commit>/).
                type: string
              conditions:
                description: Conditions represent the latest observations of the Run's
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              costUSD:
                description: CostUSD is the estimated total evaluation cost in USD
                  for this Run.
                type: number
              discovery:
                description: Discovery records pointers, hash, and counts for the
                  discovered manifest.
                properties:
                  eligibleTaskCount:
                    description: EligibleTaskCount is the number of tasks in the manifest
                      eligible for evaluation.
                    type: integer
                  manifestHash:
                    description: ManifestHash is the sha256 checksum (in sha256:<hex>
                      format) of the stored manifest.
                    type: string
                  manifestPath:
                    description: ManifestPath is the URI or path where the discovered
                      manifest is stored in the artifact store.
                    type: string
                  taskCount:
                    description: TaskCount is the total number of tasks in the discovered
                      manifest.
                    type: integer
                  taskIDs:
                    description: TaskIDs is a list of discovered task IDs, capped
                      at 50 to bound status size.
                    items:
                      type: string
                    type: array
                type: object
              discoveryDeadline:
                description: DiscoveryDeadline is the deadline by which discovery
                  must complete.
                format: date-time
                type: string
              executionDeadline:
                description: ExecutionDeadline is the deadline by which sample execution
                  must complete.
                format: date-time
                type: string
              message:
                description: Message is human-readable detail on failure or current
                  status.
                type: string
              phase:
                description: Phase is the current lifecycle phase of the Run.
                enum:
                - Pending
                - Discovering
                - Discovered
                - Running
                - Completed
                - Failed
                type: string
              prebuilds:
                description: Prebuilds records the execution status of named manifest
                  prebuilds required by this Run.
                items:
                  description: PrebuildStatus records the execution status of a named
                    manifest prebuild for a Run.
                  properties:
                    executionID:
                      description: |-
                        ExecutionID identifies the in-flight async process running inside the prebuild sandbox.
                        Cleared when the prebuild reaches a terminal phase.
                      type: string
                    finishedAt:
                      description: FinishedAt is the time when the prebuild reached
                        a terminal phase (Completed or Failed).
                      format: date-time
                      type: string
                    message:
                      description: Message is human-readable detail on prebuild status
                        or failure.
                      type: string
                    name:
                      description: Name is the prebuild name from Manifest.Prebuilds.
                      type: string
                    phase:
                      description: Phase is the current execution phase of this prebuild.
                      enum:
                      - Pending
                      - Running
                      - Completed
                      - Failed
                      type: string
                    startedAt:
                      description: StartedAt is the time when the prebuild transitioned
                        to Running.
                      format: date-time
                      type: string
                  required:
                  - name
                  type: object
                type: array
              reporting:
                description: Reporting records the status of GitHub check run reporting.
                properties:
                  checkRunID:
                    description: CheckRunID is the ID of the posted GitHub check run.
                    format: int64
                    type: integer
                  lastPostedHash:
                    description: LastPostedHash is the hash of the check run state
                      when last posted.
                    type: string
                  message:
                    description: Message is human-readable detail on reporting failure
                      (e.g. 403, 404).
                    type: string
                type: object
              summary:
                description: Summary provides aggregate statistics across tasks in
                  the Run.
                properties:
                  meanSuccessRate:
                    description: MeanSuccessRate is the simple mean of task success
                      rates across completed tasks.
                    type: number
                  rates:
                    description: Rates is a compact string of per-task rates and confidence
                      intervals for wide printer column display.
                    type: string
                  successRateRange:
                    description: SuccessRateRange is the min and max of task success
                      rates across completed tasks.
                    properties:
                      max:
                        description: Max is the maximum value in the range.
                        type: number
                      min:
                        description: Min is the minimum value in the range.
                        type: number
                    required:
                    - max
                    - min
                    type: object
                  tasks:
                    description: Tasks is a compact string representing completed
                      vs total tasks (e.g. "2/2").
                    type: string
                  tasksCompleted:
                    description: TasksCompleted is the number of tasks that completed
                      successfully.
                    type: integer
                  tasksFailed:
                    description: TasksFailed is the number of tasks that failed.
                    type: integer
                  tasksTotal:
                    description: TasksTotal is the total number of tasks.
                    type: integer
                  totalSamples:
                    description: TotalSamples is the total number of samples evaluated
                      across all tasks.
                    type: integer
                required:
                - tasksCompleted
                - tasksFailed
                - tasksTotal
                - totalSamples
                type: object
              tasks:
                description: Tasks records the status and results for each executed
                  eval task.
                items:
                  description: TaskStatus records the execution status and scores
                    for a single eval task.
                  properties:
                    cohort:
                      description: Cohort is the cohort identifier of the task (defaults
                        to "default").
                      maxLength: 64
                      type: string
                    costSource:
                      description: CostSource is the provenance of model prices used
                        to compute costUSD (configmap or default).
                      enum:
                      - configmap
                      - default
                      type: string
                    costUSD:
                      description: CostUSD is the estimated task evaluation cost in
                        USD from model prices.
                      type: number
                    executionID:
                      description: ExecutionID is the identifier of an in-flight asynchronous
                        command running in the task sandbox.
                      type: string
                    failureAttempts:
                      description: |-
                        FailureAttempts records the number of attempts that failed due to infrastructure issues.
                        Controller restarts do not count toward this limit.
                      type: integer
                    finishedAt:
                      description: FinishedAt is the time when the task reached a
                        terminal phase (Completed, Failed).
                      format: date-time
                      type: string
                    gcpProject:
                      description: GCPProject records the leased GCP project ID currently
                        assigned to this task while running.
                      type: string
                    id:
                      description: ID is the unique identifier of the task (e.g. docs/readme_comprehension).
                      type: string
                    lastProgressAt:
                      description: LastProgressAt is the timestamp when samplesDone
                        was last updated.
                      format: date-time
                      type: string
                    latency:
                      description: Latency records sample latency percentiles (p50
                        and p95 in seconds) aggregated across evaluated samples.
                      properties:
                        p50:
                          description: P50 is the 50th percentile sample latency in
                            seconds.
                          type: number
                        p95:
                          description: P95 is the 95th percentile sample latency in
                            seconds.
                          type: number
                      type: object
                    logHash:
                      description: LogHash is the sha256 checksum (in sha256:<hex>
                        format) of the stored task artifact's content as produced.
                      type: string
                    logPath:
                      description: LogPath is the path or URI where the Inspect log
                        was stored by the artifact sink.
                      type: string
                    meanScore:
                      description: MeanScore is the mean of per-sample scores in [0,
                        1].
                      type: number
                    message:
                      description: Message contains failure detail or bounded error
                        information.
                      type: string
                    phase:
                      description: Phase is the current execution phase of this task.
                      enum:
                      - Pending
                      - Running
                      - Completed
                      - Failed
                      - Skipped
                      type: string
                    possibleSamples:
                      description: PossibleSamples is the total dataset size (possible
                        samples) when known from the Inspect log.
                      type: integer
                    resources:
                      description: |-
                        Resources records the compute resource limits applied to the task sandbox container.
                        Only set for sandbox tasks.
                      properties:
                        limits:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: Limits describes the maximum amount of compute
                            resources allowed.
                          type: object
                      type: object
                    restartReason:
                      description: RestartReason records the reason why the last task
                        restart occurred.
                      type: string
                    restarts:
                      description: Restarts records the number of times the task was
                        restarted after being interrupted.
                      type: integer
                    sampleRange:
                      description: SampleRange is the sample window evaluated for
                        this task.
                      properties:
                        end:
                          description: End is the 1-based inclusive end index in the
                            dataset.
                          minimum: 1
                          type: integer
                        start:
                          description: Start is the 1-based inclusive start index
                            in the dataset.
                          minimum: 1
                          type: integer
                      required:
                      - end
                      - start
                      type: object
                      x-kubernetes-validations:
                      - message: end must be greater than or equal to start
                        rule: self.end >= self.start
                    samples:
                      description: Samples is the number of samples scored.
                      type: integer
                    samplesDone:
                      description: SamplesDone is the number of samples completed
                        so far while the task is running.
                      type: integer
                    samplesPlanned:
                      description: SamplesPlanned is the expected total number of
                        samples to be evaluated for this task.
                      type: integer
                    startedAt:
                      description: StartedAt is the time when the task transitioned
                        to Running.
                      format: date-time
                      type: string
                    successRate:
                      description: SuccessRate is the point estimate of the success
                        rate in [0, 1].
                      maximum: 1
                      minimum: 0
                      type: number
                    successRateCI:
                      description: SuccessRateCI is the confidence interval for the
                        success rate.
                      properties:
                        confidence:
                          description: Confidence is the confidence level (e.g. 0.95
                            for 95% confidence).
                          maximum: 1
                          minimum: 0
                          type: number
                        lower:
                          description: Lower is the lower confidence bound.
                          maximum: 1
                          minimum: 0
                          type: number
                        method:
                          description: Method is the estimation method used (e.g.
                            "wilson", "t").
                          type: string
                        upper:
                          description: Upper is the upper confidence bound.
                          maximum: 1
                          minimum: 0
                          type: number
                      required:
                      - confidence
                      - lower
                      - method
                      - upper
                      type: object
                    successRateSD:
                      description: SuccessRateSD is the sample standard deviation
                        of scores (for non-binary scorers).
                      type: number
                    successes:
                      description: Successes is the number of samples with score ==
                        1 (for binary scorers).
                      type: integer
                    timeoutSeconds:
                      description: TimeoutSeconds records the effective execution
                        timeout applied to the task command in seconds.
                      type: integer
                    tokens:
                      description: Tokens is the token usage breakdown consumed for
                        this task, when present in Inspect logs.
                      properties:
                        cacheRead:
                          description: CacheRead is the number of cached input tokens
                            read.
                          type: integer
                        cacheWrite:
                          description: CacheWrite is the number of tokens written
                            to the cache.
                          type: integer
                        input:
                          description: Input is the number of input/prompt tokens
                            consumed.
                          type: integer
                        output:
                          description: Output is the number of output/completion tokens
                            consumed.
                          type: integer
                        reasoning:
                          description: Reasoning is the number of reasoning/thinking
                            tokens consumed.
                          type: integer
                        total:
                          description: Total is the total number of tokens consumed
                            (input + output).
                          type: integer
                      type: object
                  required:
                  - id
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
