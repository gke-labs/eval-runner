apiVersion: v1
kind: Namespace
metadata:
  name: service-portal-system
  labels:
    kubernetes.io/metadata.name: service-portal-system
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal-node-agent
  namespace: service-portal-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: portal-node-agent
  namespace: service-portal-system
  labels:
    app: portal-node-agent
spec:
  selector:
    matchLabels:
      app: portal-node-agent
  template:
    metadata:
      labels:
        app: portal-node-agent
    spec:
      serviceAccountName: portal-node-agent
      tolerations:
      - key: service-portal.gke.io/uninitialized
        operator: Exists
        effect: NoSchedule
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      initContainers:
      - name: node-init
        image: portal-nri-plugin
        args: ["init", "-ca-dir=/etc/service-portal/ca", "-socket-dir=/run/service-portal", "-proxy-uid=0", "-proxy-gid=0"]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: ca-volume
          mountPath: /etc/service-portal/ca
        - name: socket-volume
          mountPath: /run/service-portal
      containers:
      - name: proxy
        image: portal-node-proxy
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE"]
        env:
        - name: PORT
          value: "8080"
        - name: HTTPS_PORT
          value: "8443"
        - name: PROXY_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: ENABLE_POD_MAP
          value: "true"
        - name: ADMIN_ADDR
          value: "/run/service-portal/portal.sock"
        - name: CA_CERT_PATH
          value: "/etc/service-portal/ca/tls.crt"
        - name: CA_KEY_PATH
          value: "/etc/service-portal/ca/tls.key"
        - name: SERVE_DNS
          value: "true"
        args: ["--rules-dir=/etc/portals"]
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 1
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: rules-volume
          mountPath: /etc/portals
          readOnly: true
        - name: ca-volume
          mountPath: /etc/service-portal/ca
          readOnly: true
        - name: socket-volume
          mountPath: /run/service-portal
      - name: nri-plugin
        image: portal-nri-plugin
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "SYS_ADMIN"]
        env:
        - name: PROXY_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: PROXY_PORT
          value: "8080"
        - name: PROXY_HTTPS_PORT
          value: "8443"
        - name: ADMIN_URL
          value: "unix:///run/service-portal/portal.sock"
        - name: CA_CERT_PATH
          value: "/etc/service-portal/ca/tls.crt"
        - name: NRI_SOCKET_PATH
          value: "/var/run/nri/nri.sock"
        readinessProbe:
          exec:
            command:
            - stat
            - /var/run/nri/nri.sock
          initialDelaySeconds: 1
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: ca-volume
          mountPath: /etc/service-portal/ca
        - name: nri-socket
          mountPath: /var/run/nri
        - name: netns
          mountPath: /run/netns
          mountPropagation: HostToContainer
        - name: socket-volume
          mountPath: /run/service-portal
      volumes:
      - name: rules-volume
        projected:
          sources:
          - secret:
              name: portal-rules
              optional: true
          - configMap:
              name: portal-passthrough-rules
              optional: true
      - name: ca-volume
        hostPath:
          path: /etc/service-portal/ca
          type: DirectoryOrCreate
      - name: nri-socket
        hostPath:
          path: /var/run/nri
      - name: netns
        hostPath:
          path: /run/netns
      - name: socket-volume
        hostPath:
          path: /run/service-portal
          type: DirectoryOrCreate
